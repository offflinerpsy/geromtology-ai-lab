<!doctype html><html lang="en"><meta charset="utf-8"><title>Inquiry layers review</title><style>body{margin:0;background:#ddd;font:14px system-ui}header{height:55px;display:flex;align-items:center;gap:15px;padding:0 15px}iframe{display:block;border:0;height:810px;background:white}pre{margin:10px;white-space:pre-wrap}</style>
<header><label>Viewport <select id="width"><option>360</option><option>430</option><option>768</option><option>800</option><option>801</option><option selected>1200</option></select></label><button id="inspect">Inspect</button><button id="motion">Measure motion</button><button id="parallax">Measure parallax</button><button id="center">Center study</button></header><iframe id="view" title="Homepage inquiry" src="/#research" width="1200"></iframe><pre id="result">Loading</pre>
<script>
const view=document.getElementById('view'),result=document.getElementById('result');
function center(){const d=view.contentWindow.document;view.contentWindow.scrollTo(0,d.querySelector('#research').offsetTop-96);}
document.getElementById('width').onchange=e=>{view.width=e.target.value;setTimeout(()=>{center();inspect()},400)};
function inspect(){const w=view.contentWindow,d=w.document,art=d.querySelector('.inquiry-art'),images=[...art.querySelectorAll('img')],control=d.querySelector('.inquiry-motion-control');result.textContent=JSON.stringify({width:w.innerWidth,overflow:d.documentElement.scrollWidth-w.innerWidth,ready:art.dataset.ready,state:art.dataset.animationState,renderer:art.dataset.renderer,sprites:images.length,broken:images.filter(i=>!i.complete||!i.naturalWidth).length,control:control.getBoundingClientRect().toJSON(),fonts:d.fonts.status},null,2)}
document.getElementById('inspect').onclick=inspect;document.getElementById('center').onclick=()=>{center();inspect()};
function signature(){const d=view.contentWindow.document,c=d.querySelector('.inquiry-art canvas'),ctx=c.getContext('2d');if(!ctx)return null;const p=ctx.getImageData(0,0,c.width,c.height).data;let hash=0,alpha=0,y=0,clear=0;for(let i=0;i<p.length;i+=128){hash=(Math.imul(hash,31)+p[i]+p[i+1]*3+p[i+2]*5+p[i+3]*7)|0;alpha+=p[i+3];y+=Math.floor(i/4/c.width)*p[i+3];if(p[i+3]===0)clear++}return {hash,y:alpha?y/alpha:0,clear}}
function measure(parallax){const before=signature();if(parallax)view.contentWindow.scrollBy(0,220);result.textContent='Measuring';setTimeout(()=>{const after=signature();result.textContent=JSON.stringify({before,after,changed:before?.hash!==after?.hash,centroidShift:after?.y-before?.y,state:view.contentWindow.document.querySelector('.inquiry-art').dataset.animationState},null,2)},1450)}
document.getElementById('motion').onclick=()=>measure(false);document.getElementById('parallax').onclick=()=>measure(true);view.onload=()=>setTimeout(()=>{center();inspect()},1100);
</script></html>
